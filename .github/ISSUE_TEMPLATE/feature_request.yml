name: An idea
description: Something reed should do, or should do differently.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What you were doing when you wanted this is the most useful thing you can tell us.
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
      description: scp, a git branch, Dropbox, giving up — all useful answers.
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
      description: Optional. A rough shape is fine.
